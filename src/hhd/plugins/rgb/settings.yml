rgb:
  handheld:
    type: container
    title: RGB Settings
    tags: [ hide-title ]
    children:
      mode:
        type: mode
        title: RGB Mode
        modes:
      controller:
        title: Controller RGB
        type: display
        tags: [ non-essential, controller-disclaimer, info ]
        default: >-
          Dualsense controls the LEDs.
          Switch to Xbox or disable Dualsense LEDs.
      xbox_led:
        type: mode
        title: Xbox Button LED
        default: steady
        modes:
          disabled:
            type: container
            title: Disabled
            tags: [ disabled ]
            children: {}
          steady:
            type: container
            title: Steady
            children:
              brightnessd:
                type: multiple
                title: Brightness
                tags: [ non-essential, ordinal ]
                options:
                  low: "Low"
                  medium: "Medium"
                  high: "High"
                default: high
          breathe:
            type: container
            title: Breathing
            children:
              brightnessd:
                type: multiple
                title: Brightness
                tags: [ non-essential, ordinal ]
                options:
                  low: "Low"
                  medium: "Medium"
                  high: "High"
                default: high

hhd:
  settings:
    type: container

    children:
      rgb:
        type: bool
        title: "Enable RGB support."
        default: True