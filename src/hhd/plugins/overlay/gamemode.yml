gamescope:
  type: container
  title: Gamescope
  children:
    framegen:
      type: mode
      title: "Frame Generation"
      default: disabled
      modes:
        disabled:
          type: container
          title: "Disabled"
        enabled:
          type: container
          title: "Enabled"
          children:
            quality:
              tags: [non-essential]
              type: int
              title: "Quality"
              default: 7
              min: 1
              max: 10
              step: 1

    steamui_halfhz:
      tags: [non-essential]
      type: bool
      title: "Run Steam at 60/72 Hz"
      default: false

    dpms:
      tags: [non-essential]
      type: bool
      title: "Poweroff screen before sleep"
      default: true

display:
  type: container
  title: Display
  children:
    touchscreen_disable:
      type: bool
      title: "Disable Touchscreen (Until Restart)"

    gestures_disable:
      type: bool
      title: "Disable Touch Gestures (Until Restart)"